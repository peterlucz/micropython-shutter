# ─────────────────────────────────────────────────────────────────────────────
# Hallway lights: motion / button controlled, daytime-evening-night presets
#
# Deploy:  python3 deploy_ha.py packages/hallway_light.yaml
#
# This migrates automation.turn_off_by_sensors (alias "Light:Hallway:Light",
# id 1767705730934) from UI-only into git — it previously lived only in HA's
# storage, unlike every other automation in this repo. The id is kept
# identical so redeploying updates the existing automation in place instead
# of creating a duplicate.
#
# Presets, same idea as before (one of three states, motion/button-triggered):
#   * daytime — 100% brightness, cool white. Start time tracks the
#     shutters' own open time (input_datetime.open_time_workday /
#     open_time_holiday in packages/shutters.yaml, including their
#     workday/holiday_days_left resolution) instead of an independent
#     fixed Schedule helper. Night's own end is *derived from* that same
#     open time (not the Schedule integration's separately-editable
#     working_night/weekend_night "before" field) so the two can never
#     drift apart -- found live 2026-09-21: open_time_workday (06:20) sat
#     ten minutes inside the old fixed working_night window (23:00-06:30),
#     so the night scene kept re-triggering at the open time instead of
#     daytime. Also: the two Morning-open time triggers fire every day
#     unconditionally (a bare `time` trigger has no day-of-week filter) --
#     the automation-level `conditions:` below now requires each one to
#     match today's actual effective day type (workday vs weekend/holiday,
#     including the holiday_days_left override) before doing anything, so
#     the workday trigger can't fire the automation at all on a weekend
#     and vice versa.
#   * evening / night — scene.hallway_evening / scene.hallway_night (dimmed,
#     warm, UI-managed scenes — deploy_ha.py doesn't push scenes). Their
#     start times (hallway_evening_start, live 21:00; hallway_night_start,
#     live 23:00) are dashboard-tunable input_datetime helpers (2026-09-21),
#     shared across workday/weekend since both used identical values anyway
#     -- previously these lived only in a HA "Schedule" integration entity
#     not editable from any dashboard here.
#
# Daytime color temperature is no longer the scene's fixed 4000K: it's
# computed from the live outside temperature (sensor.outside_temp_1_temperature,
# the physical sensor — not the Met.no forecast entity), sliding between
# hallway_daytime_kelvin_warm (cold-weather target) and _kelvin_cool
# (hot-weather target) as the temperature moves between hallway_temp_cold and
# hallway_temp_hot, clamped to the lamps' own 2202-4000K range. Evening/night
# keep their fixed warm presets year-round.
#
# Full-output override: a second zigbee button forces all 9 lamps to 100%/
# 4000K regardless of motion, for extended hallway work (cleaning, cupboard).
# Its "on" click starts it, "off" cancels it immediately, and it also
# auto-expires after hallway_override_minutes as a safety net. While active,
# the normal motion/schedule branches below stand down. The same remote's
# left/right arrows step the lamps' brightness up/down directly, independent
# of the override/preset state.
#
# Turn-off reliability: light.all_hallway_lights fans out to 9 individual
# Zigbee commands via Z2M, with no HA-level delivery guarantee. Peter
# reported some lamps randomly staying on after an off -- history showed
# hallway_lamp_4b and _8b are repeat offenders (11+ / 7+ times over 48h),
# with occasional others, pointing at marginal Zigbee links rather than
# pure chance. Fixed 2026-09-24: the off branch now waits for the 5s
# transition, then retries turn_off on any still-on stragglers (up to 2x).
#
# Button: hallway-button-1, an IKEA E2001/E2002 (TRADFRI open/close remote),
# device_id afd8735882986a624d258290db824a6d, paired 2026-09-18. (An earlier
# Loginovo ZG-101ZL button was tried first for the override -- its switch
# turned out to have a hardware fault, confirmed dead across many attempts
# under both operation_mode values and a full re-pair; abandoned in favor of
# this one. That old device, HA device_id a5a1e9a651111f336d0bcdf379e637b6,
# may still show up in HA under the same "hallway-button-1" display name
# from the rename -- it's the dead unit, not this one; safe to remove.)
# ─────────────────────────────────────────────────────────────────────────────

input_boolean:
  hallway_override:
    name: "Hallway — full output override"
    icon: mdi:lightbulb-alert-outline

input_datetime:
  hallway_evening_start:
    name: "Hallway — evening start"   # live: 21:00
    has_time: true
    has_date: false
    icon: mdi:weather-sunset

  hallway_night_start:
    name: "Hallway — night start"   # live: 23:00
    has_time: true
    has_date: false
    icon: mdi:weather-night

input_number:
  hallway_override_minutes:
    name: "Hallway override — auto-off time"   # live: 30
    min: 5
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-outline
    mode: box

  hallway_daytime_kelvin_warm:
    name: "Hallway daytime — winter color temp"   # live: 3200
    min: 2202
    max: 4000
    step: 50
    unit_of_measurement: "K"
    icon: mdi:thermometer-low
    mode: box

  hallway_daytime_kelvin_cool:
    name: "Hallway daytime — summer color temp"   # live: 4000
    min: 2202
    max: 4000
    step: 50
    unit_of_measurement: "K"
    icon: mdi:thermometer-high
    mode: box

  hallway_temp_cold:
    name: "Hallway daytime — cold outside temp"   # live: 0
    min: -20
    max: 20
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:snowflake
    mode: box

  hallway_temp_hot:
    name: "Hallway daytime — hot outside temp"   # live: 25
    min: 10
    max: 40
    step: 1
    unit_of_measurement: "°C"
    icon: mdi:weather-sunny
    mode: box

  hallway_dim_step_pct:
    name: "Hallway dim — step size"   # live: 10
    min: 1
    max: 50
    step: 1
    unit_of_measurement: "%"
    icon: mdi:brightness-6
    mode: box

timer:
  hallway_override_hold:
    name: "Hallway override — hold"
    icon: mdi:lightbulb-on-outline
    restore: true

automation:
  # ── 1. Main: motion/button -> daytime/evening/night, or off ──────────────
  - id: "1767705730934"
    alias: "Light:Hallway:Light"
    description: >-
      Motion or a button click turns the hallway lights on to whichever
      preset matches the time of day; daytime's start now tracks the
      shutters' open time instead of a fixed clock time, and its color
      temperature scales with the outside temperature. Stands down while
      the full-output override (see the hallway_override automation) is
      active.
    triggers:
      - domain: mqtt
        device_id: 783334daa0bd3b15684be465b557f316   # inside-button-5
        type: action
        subtype: single
        trigger: device
        alias: "Turn on by button"
        id: "Turn on by button"
      - alias: "Turn on by motion sensor"
        trigger: state
        entity_id:
          - binary_sensor.hallway_motion_sensors
        from: ["off"]
        to: ["on"]
        id: "Turn on by motion sensor"
      - alias: "Morning open (workday)"
        trigger: time
        at: input_datetime.open_time_workday
        id: "Morning open (workday)"
      - alias: "Morning open (holiday)"
        trigger: time
        at: input_datetime.open_time_holiday
        id: "Morning open (holiday)"
      - domain: mqtt
        device_id: 783334daa0bd3b15684be465b557f316   # inside-button-5
        type: action
        subtype: double
        trigger: device
        alias: "Turn off by button"
        id: "Turn off by button"
      - alias: "Turn off by motion sensor"
        trigger: state
        entity_id:
          - binary_sensor.hallway_motion_sensors
        to: ["off"]
        from: ["on"]
        for:
          hours: 0
          minutes: 0
          seconds: 0
        id: "Turn off by motion sensor"
    conditions:
      - alias: "Morning-open triggers only re-preset lights already on, on their own day type"
        condition: template
        # Morning open only switches already-lit lamps from night to daytime;
        # it must not turn them on in an empty hallway (off only happens on a
        # motion on->off edge, so they'd stay lit until someone walked by).
        value_template: >-
          {% set is_effective_workday = is_state('binary_sensor.workday_sensor','on')
             and states('input_number.holiday_days_left')|int(0) <= 0 %}
          {{ trigger.id not in ['Morning open (workday)', 'Morning open (holiday)']
             or (is_state('light.all_hallway_lights', 'on')
                 and ((trigger.id == 'Morning open (workday)' and is_effective_workday)
                      or (trigger.id == 'Morning open (holiday)' and not is_effective_workday))) }}
    actions:
      - choose:
          - alias: "Hallway daytime"
            conditions:
              - alias: "Turn on triggers"
                condition: or
                conditions:
                  - condition: trigger
                    id:
                      - "Turn on by button"
                      - "Turn on by motion sensor"
                      - "Morning open (workday)"
                      - "Morning open (holiday)"
              - condition: state
                entity_id: input_boolean.hallway_override
                state: "off"
              - alias: "Is daytime (after shutter open time, before evening)"
                condition: template
                value_template: >-
                  {% set is_workday = is_state('binary_sensor.workday_sensor','on')
                     and states('input_number.holiday_days_left')|int(0) <= 0 %}
                  {% set open_time = states('input_datetime.open_time_workday') if is_workday
                     else states('input_datetime.open_time_holiday') %}
                  {{ now() >= today_at(open_time)
                     and now() < today_at(states('input_datetime.hallway_evening_start')) }}
            sequence:
              - alias: "Hallway daytime action"
                action: light.turn_on
                target:
                  entity_id: light.all_hallway_lights
                data:
                  brightness_pct: 100
                  color_temp_kelvin: >-
                    {% set t = states('sensor.outside_temp_1_temperature')|float(15) %}
                    {% set cold = states('input_number.hallway_temp_cold')|float(0) %}
                    {% set hot  = states('input_number.hallway_temp_hot')|float(25) %}
                    {% set warm_k = states('input_number.hallway_daytime_kelvin_warm')|float(3200) %}
                    {% set cool_k = states('input_number.hallway_daytime_kelvin_cool')|float(4000) %}
                    {% set span = [hot - cold, 0.1]|max %}
                    {% set frac = [[(t - cold) / span, 0]|max, 1]|min %}
                    {% set k = (warm_k + (cool_k - warm_k) * frac) | round | int %}
                    {{ [[k, 2202]|max, 4000]|min }}
          - alias: "Hallway evening"
            conditions:
              - alias: "Turn on triggers"
                condition: or
                conditions:
                  - condition: trigger
                    id:
                      - "Turn on by button"
                      - "Turn on by motion sensor"
                      - "Morning open (workday)"
                      - "Morning open (holiday)"
              - condition: state
                entity_id: input_boolean.hallway_override
                state: "off"
              - alias: "Is evening (between evening start and night start)"
                condition: template
                value_template: >-
                  {{ now() >= today_at(states('input_datetime.hallway_evening_start'))
                     and now() < today_at(states('input_datetime.hallway_night_start')) }}
            sequence:
              - alias: "Hallway evening action"
                action: scene.turn_on
                target:
                  entity_id: scene.hallway_evening
          - alias: "Hallway night"
            conditions:
              - alias: "Turn on triggers"
                condition: or
                conditions:
                  - condition: trigger
                    id:
                      - "Turn on by button"
                      - "Turn on by motion sensor"
                      - "Morning open (workday)"
                      - "Morning open (holiday)"
              - condition: state
                entity_id: input_boolean.hallway_override
                state: "off"
              - alias: "Is night (after night start, or before shutter open time)"
                condition: template
                value_template: >-
                  {% set is_workday = is_state('binary_sensor.workday_sensor','on')
                     and states('input_number.holiday_days_left')|int(0) <= 0 %}
                  {% set open_time = states('input_datetime.open_time_workday') if is_workday
                     else states('input_datetime.open_time_holiday') %}
                  {{ now() >= today_at(states('input_datetime.hallway_night_start'))
                     or now() < today_at(open_time) }}
            sequence:
              - alias: "Hallway night action"
                action: scene.turn_on
                target:
                  entity_id: scene.hallway_night
          - alias: "Turn off hallway lights"
            conditions:
              - alias: "Turn off triggers"
                condition: or
                conditions:
                  - condition: trigger
                    id:
                      - "Turn off by button"
                      - "Turn off by motion sensor"
              - condition: state
                entity_id: input_boolean.hallway_override
                state: "off"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: light.all_hallway_lights
                data:
                  transition: 5
              # light.all_hallway_lights fans out to 9 individual Zigbee
              # commands with no HA-level delivery guarantee -- found
              # 2026-09-24 that hallway_lamp_4b and _8b in particular
              # regularly miss the off command and stay lit. Catch and
              # retry any stragglers instead of leaving them on until the
              # next motion/button event.
              - delay:
                  seconds: 7
              - repeat:
                  count: 2
                  sequence:
                    - condition: template
                      value_template: >-
                        {{ expand('light.all_hallway_lights')
                           | selectattr('state', 'eq', 'on') | list | count > 0 }}
                    - action: light.turn_off
                      target:
                        entity_id: >-
                          {{ expand('light.all_hallway_lights')
                             | selectattr('state', 'eq', 'on')
                             | map(attribute='entity_id') | list }}
                    - delay:
                        seconds: 4
    # restart, not single: the off branch stays busy ~15s (transition wait +
    # straggler retries), and single mode silently dropped motion-on triggers
    # arriving in that window, leaving someone in a dark hallway.
    mode: restart

  # ── 2. Full-output override (cleaning / cupboard) ─────────────────────────
  - id: hallway_override
    alias: "Light:Hallway:Override"
    description: >-
      "On" click forces all hallway lamps to 100%/4000K regardless of
      motion, for extended work in the hallway. "Off" click, or an idle
      timeout (hallway_override_minutes), cancels it and turns the lights
      off. While active, Light:Hallway:Light stands down.
    triggers:
      - domain: mqtt
        device_id: afd8735882986a624d258290db824a6d   # hallway-button-1 (IKEA remote)
        type: action
        subtype: "on"
        trigger: device
        id: "override_on"
      - domain: mqtt
        device_id: afd8735882986a624d258290db824a6d   # hallway-button-1 (IKEA remote)
        type: action
        subtype: "off"
        trigger: device
        id: "override_off"
      - platform: event
        event_type: timer.finished
        event_data:
          entity_id: timer.hallway_override_hold
        id: "override_timeout"
    conditions: []
    actions:
      - choose:
          - alias: "Start override"
            conditions:
              - condition: trigger
                id: ["override_on"]
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.hallway_override
              - action: timer.start
                target:
                  entity_id: timer.hallway_override_hold
                data:
                  duration: "{{ states('input_number.hallway_override_minutes')|int(30) * 60 }}"
              - action: light.turn_on
                target:
                  entity_id: light.all_hallway_lights
                data:
                  brightness_pct: 100
                  color_temp_kelvin: "{{ states('input_number.hallway_daytime_kelvin_cool')|int(4000) }}"
          - alias: "End override"
            conditions:
              - condition: trigger
                id: ["override_off", "override_timeout"]
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.hallway_override
              - action: timer.cancel
                target:
                  entity_id: timer.hallway_override_hold
              - action: light.turn_off
                target:
                  entity_id: light.all_hallway_lights
    mode: single

  # ── 3. Manual dim (left/right arrows) ─────────────────────────────────────
  - id: hallway_dim
    alias: "Light:Hallway:Dim"
    description: >-
      The hallway remote's left/right arrows step the lamps' brightness
      down/up by hallway_dim_step_pct, independent of whatever preset or
      override is currently active.
    triggers:
      - domain: mqtt
        device_id: afd8735882986a624d258290db824a6d   # hallway-button-1 (IKEA remote)
        type: action
        subtype: arrow_left_click
        trigger: device
        id: "dim_down"
      - domain: mqtt
        device_id: afd8735882986a624d258290db824a6d   # hallway-button-1 (IKEA remote)
        type: action
        subtype: arrow_right_click
        trigger: device
        id: "dim_up"
    conditions: []
    actions:
      - action: light.turn_on
        target:
          entity_id: light.all_hallway_lights
        data:
          brightness_step_pct: >-
            {% set step = states('input_number.hallway_dim_step_pct')|int(10) %}
            {{ -step if trigger.id == 'dim_down' else step }}
    mode: single

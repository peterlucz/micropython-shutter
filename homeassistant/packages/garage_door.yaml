# ─────────────────────────────────────────────────────────────────────────────
# Garage door push-button behaviour
#
# Deploy:  python3 deploy_ha.py packages/garage_door.yaml
#
# switch.pico_relay_02efbe_switch_3 ("Garage door", board 3 relay 14) drives
# the garage opener's trigger input, which expects a short contact closure —
# not a latched switch. Whenever the switch turns on, this automation turns
# it back off after garage_door_pulse_ms milliseconds, so from HA it behaves
# like a push button regardless of who turned it on (dashboard, voice,
# automation).
#
# Defence in depth: the Pico's devices.json gives the same device
# "duration": 1000, so the firmware itself drops the relay after 1 s even if
# HA or WiFi dies mid-pulse (a latched contact would block the opener).
# Keep the helper's maximum below that backstop.
#
# Accidental-tap guard: the garage dashboard never touches the relay switch
# directly. It starts timer.garage_door_release (a 1-minute arming window,
# restarted on re-press) and calls script.garage_door_open, which only pulses
# the relay while that timer is active. The window stays open for the full
# minute so a second press can stop/reverse the door. No restore: an HA
# restart drops the window, which is the safe direction.
#
# Physical buttons: a single or double click on garage-button-1 (SONOFF, in
# the garage) or inside-button-4 (Aqara mini switch) pulses the relay
# directly — pressing a dedicated physical button is the deliberate gesture,
# so no release window is involved. (Started double-click-only 2026-07-17;
# single click added 2026-07-18 once the buttons had earned trust.) The
# Zigbee2MQTT buttons expose clicks only as MQTT device triggers, hence the
# device_ids.
# ─────────────────────────────────────────────────────────────────────────────

input_number:
  garage_door_pulse_ms:
    name: "Garage door — pulse length"    # live: 150; firmware backstop 1000
    min: 50
    max: 500
    step: 10
    unit_of_measurement: "ms"
    icon: mdi:timer-outline
    mode: box

timer:
  garage_door_release:
    name: "Garage door — opener release"
    icon: mdi:lock-open-variant
    duration: "00:01:00"

script:
  garage_door_open:
    alias: "Garage door: trigger opener"
    description: >-
      Pulses the garage door relay, but only while the release window
      (timer.garage_door_release) is running — the guard against accidental
      dashboard taps.
    icon: mdi:garage-open-variant
    sequence:
      - condition: state
        entity_id: timer.garage_door_release
        state: active
      - action: switch.turn_on
        target:
          entity_id: switch.pico_relay_02efbe_switch_3
    mode: single

automation:
  - id: garage_door_pulse
    alias: "Garage door: pulse relay off"
    description: "Turns the garage door relay off garage_door_pulse_ms after it switches on"
    triggers:
      - platform: state
        entity_id: switch.pico_relay_02efbe_switch_3
        to: "on"
    actions:
      - delay:
          milliseconds: "{{ states('input_number.garage_door_pulse_ms')|float(150)|int }}"
      - action: switch.turn_off
        target:
          entity_id: switch.pico_relay_02efbe_switch_3
    mode: restart

  - id: garage_door_button_double
    alias: "Garage door: open on button click"
    description: >-
      Pulses the garage door relay on a single or double click of
      garage-button-1 or inside-button-4. The physical button press is the
      confirmation gesture, so this bypasses the dashboard release window.
    triggers:
      - platform: device
        domain: mqtt
        device_id: 4ac56407309a8b42396556b1cd20199e   # garage-button-1
        type: action
        subtype: single
      - platform: device
        domain: mqtt
        device_id: 4ac56407309a8b42396556b1cd20199e   # garage-button-1
        type: action
        subtype: double
      - platform: device
        domain: mqtt
        device_id: f8fe8d9686f18cad98e30f08d00ffadf   # inside-button-4
        type: action
        subtype: single
      - platform: device
        domain: mqtt
        device_id: f8fe8d9686f18cad98e30f08d00ffadf   # inside-button-4
        type: action
        subtype: double
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.pico_relay_02efbe_switch_3
    mode: single

# ─────────────────────────────────────────────────────────────────────────────
# Bedroom Kodi power (no smart TV — button-driven)
#
# Deploy:  python3 deploy_ha.py packages/bedroom_kodi.yaml
#
# The bedroom Raspberry Pi (LibreELEC, media_player.libreelec_halo) is
# powered by inside-socket-3. There is no controllable TV in the bedroom,
# so a single click on inside-button-1 or inside-button-3 (Aqara Mi
# wireless switches — z2m exposes clicks only as MQTT device triggers,
# hence the device_ids) acts as a power toggle:
#
#   - socket off                  -> socket on, LibreELEC boots on power
#   - Kodi running                -> ask it for a clean OS shutdown; the
#                                    off automation below cuts the socket
#   - Pi halted but socket still  -> power-cycle the socket to reboot
#     on (stuck state)               (recovers a missed socket-off)
#
# The off automation cuts the socket a minute after the Kodi entity goes
# off/unavailable — which also happens when Kodi is merely UNREACHABLE
# (WiFi blip, Kodi crash), so it additionally requires confirmation that
# the Pi has actually halted. Same for the stuck-state button branch. If
# the Pi still looks up, the socket is left alone and the trigger simply
# re-fires on the next off transition.
#
# Confirmation used to be the socket's power meter alone (running ~5 W,
# halted well under 1 W, threshold 2 W — measured 2026-07-11..17). Broke
# once inside-socket-3 started also powering a Chromecast on the same
# relay: the Chromecast's own idle draw (~3.9-4.7 W) sits above the 2 W
# threshold on its own, so the condition failed on every run from
# 2026-08-11 through 2026-08-25 and the socket never cut — confirmed via
# automation traces (all `failed_conditions` at the power check) and a
# week of sensor.inside_socket_3_power history (never settles under 2 W
# once the Chromecast is sharing the circuit, even overnight with the Pi
# genuinely off).
#
# Replaced 2026-08-26 with binary_sensor.bedroom_kodi_pi_reachable (HA's
# "Ping (ICMP)" integration against the Pi's IP 192.168.1.22 — note: IP,
# not the mDNS hostname LibreELEC-halo.local, since HAOS couldn't resolve
# .local names itself. Confirm 192.168.1.22 has a DHCP reservation; if
# not, revisit this if the lease ever moves). That sensor still polls on
# its own fixed 5-minute schedule regardless of anything else, which
# bounded off-detection latency at up to ~6 minutes.
#
# Tightened same day, twice:
#
# 1st attempt: gate pinging on socket power dropping below a threshold
# (~4.9 W, between the Chromecast's idle ceiling and Kodi's playing
# floor), to avoid pinging at all while Kodi's obviously in use. Reverted
# within the hour — sensor.inside_socket_3_power is a zigbee2mqtt sensor
# that only reports on its own schedule/delta threshold, not something HA
# polls on demand. Caught it live: it sat at a stale 4.91 W for 20+
# minutes spanning an actual Kodi shutdown, permanently above the gate,
# so the trigger never fired even though the Pi had genuinely halted.
# Unreliable as a gate; not used for triggering or aborting any more.
#
# Current design: triggers directly off media_player.libreelec_halo going
# off/unavailable (the Kodi integration's own live WebSocket push — fast,
# reliable, no polling gap), same as the original fix. From there it
# actively re-pings the Pi every 15 s and cuts the socket once 3
# consecutive checks come back unreachable — debounces a single
# transient WiFi packet-loss blip from being mistaken for a real halt.
#
# Replaces the UI-managed pair "Socket:Bedroom:Kodi:On/Off" (deleted
# 2026-07-18), which could cut power to a live Pi and whose buttons only
# powered on. Living-room sibling: packages/livingroom_kodi.yaml (TV
# state instead of buttons).
# ─────────────────────────────────────────────────────────────────────────────

automation:
  - id: bedroom_kodi_button
    alias: "Socket:Bedroom:Kodi:Button"
    description: >-
      Single click on inside-button-1/-3 toggles the bedroom Kodi Pi:
      boots it, shuts it down cleanly, or power-cycles a halted-but-
      powered Pi.
    triggers:
      - trigger: device
        domain: mqtt
        device_id: 0328b55df46324d65ec9f8384401511d   # inside-button-1
        type: action
        subtype: single
      - trigger: device
        domain: mqtt
        device_id: 57204cc62f5af1820e24a68540741115   # inside-button-3
        type: action
        subtype: single
    actions:
      - choose:
          # socket off -> power up, Pi boots by itself
          - conditions:
              - condition: state
                entity_id: switch.inside_socket_3
                state: "off"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.inside_socket_3
          # Kodi running -> graceful shutdown; socket-off follows via
          # the automation below
          - conditions:
              - condition: not
                conditions:
                  - condition: state
                    entity_id: media_player.libreelec_halo
                    state:
                      - "off"
                      - unavailable
                      - unknown
            sequence:
              - action: kodi.call_method
                target:
                  entity_id: media_player.libreelec_halo
                data:
                  method: System.Shutdown
                continue_on_error: true
          # stuck: socket on, Kodi down, Pi confirmed unreachable ->
          # power-cycle to reboot. Force a fresh ping first — the
          # background poll is only every 5 min, too stale to trust for
          # a button press someone is standing at right now.
          - conditions:
              - condition: state
                entity_id: binary_sensor.bedroom_kodi_pi_reachable
                state: "off"
            sequence:
              - action: homeassistant.update_entity
                target:
                  entity_id: binary_sensor.bedroom_kodi_pi_reachable
              - delay:
                  seconds: 5
              - condition: state
                entity_id: binary_sensor.bedroom_kodi_pi_reachable
                state: "off"
              - action: switch.turn_off
                target:
                  entity_id: switch.inside_socket_3
              - delay:
                  seconds: 5
              - action: switch.turn_on
                target:
                  entity_id: switch.inside_socket_3
      # remaining case (socket on, Kodi unreachable, power still high —
      # a live but disconnected Pi): deliberately do nothing
    mode: single

  - id: bedroom_kodi_off
    alias: "Socket:Bedroom:Kodi:Off"
    description: >-
      A minute after Kodi goes off/unavailable, re-pings the Pi every
      15s. Cuts the socket once 3 consecutive checks come back
      unreachable (debounces a single transient WiFi blip).
    triggers:
      - trigger: state
        entity_id: media_player.libreelec_halo
        to: "off"
        for: "00:01:00"
      - trigger: state
        entity_id: media_player.libreelec_halo
        to: unavailable
        for: "00:01:00"
    conditions:
      - condition: state
        entity_id: switch.inside_socket_3
        state: "on"
    actions:
      - variables:
          miss_count: 0
      - repeat:
          count: 40   # 40 x 15s = 10 min worst case before giving up
          sequence:
            - condition: state
              entity_id: switch.inside_socket_3
              state: "on"
            - action: homeassistant.update_entity
              target:
                entity_id: binary_sensor.bedroom_kodi_pi_reachable
            - delay:
                seconds: 5
            - variables:
                miss_count: >-
                  {{ (miss_count + 1) if is_state('binary_sensor.bedroom_kodi_pi_reachable', 'off') else 0 }}
            - if:
                - condition: template
                  value_template: "{{ miss_count >= 3 }}"
              then:
                - action: switch.turn_off
                  target:
                    entity_id: switch.inside_socket_3
                - stop: "Pi unreachable on 3 consecutive checks, socket cut"
            - delay:
                seconds: 10
    mode: single

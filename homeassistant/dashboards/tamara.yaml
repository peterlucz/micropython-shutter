# Tamara's room dashboard — same pattern as dashboards/hanna.yaml.
# tamara_temp_4 (temp/humidity) moved in from Hanna's room 2026-09-22.
#
# Built-in cards only. Pushed to HA at /dashboard-tamara via push_dashboard.py.

title: Tamara
views:
  - title: Tamara
    path: tamara
    icon: mdi:human-female-girl
    badges:
      - type: entity
        entity: switch.tamara_switch_1
      - type: entity
        entity: sensor.inside_temp_4_temperature
      - type: entity
        entity: sensor.inside_temp_4_humidity
      - type: entity
        entity: cover.pico_relay_02efbc_shutter_2
      - type: entity
        entity: cover.pico_relay_02efbc_shutter_3
    type: sections
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Today
            forecast_type: hourly
            forecast_slots: 10
            show_current: false
            show_forecast: true
            grid_options: {columns: 12, rows: 2}
          - type: weather-forecast
            entity: weather.forecast_home
            name: Next days
            forecast_type: daily
            show_current: false
            show_forecast: true
            grid_options: {columns: 12, rows: 3}

          # ── Shutters ──────────────────────────────────────────────
          - type: tile
            entity: cover.pico_relay_02efbc_shutter_2
            name: Shutter 2
            color: green
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets:
                  - cover.pico_relay_02efbc_shutter_2
          - type: tile
            entity: cover.pico_relay_02efbc_shutter_3
            name: Shutter 3
            color: green
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets:
                  - cover.pico_relay_02efbc_shutter_3

          # ── Lamp ──────────────────────────────────────────────────
          - type: tile
            entity: switch.tamara_switch_1
            name: Lamp
            state_content:
              - state
              - last_changed
            features:
              - type: toggle
            grid_options: {columns: 12, rows: 2}

          # ── Room sensor ───────────────────────────────────────────
          - type: tile
            entity: sensor.inside_temp_4_temperature
            name: Temperature
            grid_options: {columns: 6, rows: 2}
          - type: tile
            entity: sensor.inside_temp_4_humidity
            name: Humidity
            grid_options: {columns: 6, rows: 2}

          # ── Wake-up light ─────────────────────────────────────────
          - type: heading
            heading: Wake-up light
            icon: mdi:alarm
          - type: entities
            entities:
              - input_datetime.tamara_wakeup_workday
              - input_datetime.tamara_wakeup_holiday
              - input_number.tamara_holiday_days_left

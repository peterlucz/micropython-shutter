# Bedroom dashboard — standalone (was merged with Living room, split back
# out 2026-09-21). Same card pattern as the other room dashboards: badges,
# weather (hourly + daily), shutter + reset button, Kodi/Chromecast tiles,
# room temperature/humidity.
#
# Built-in cards only. Pushed to HA at /dashboard-bedroom via push_dashboard.py.

title: Bedroom
views:
  - title: Bedroom
    path: bedroom
    icon: mdi:bed
    badges:
      - type: entity
        entity: switch.inside_socket_3
      - type: entity
        entity: sensor.inside_temp_1_temperature
      - type: entity
        entity: sensor.inside_temp_1_humidity
      - type: entity
        entity: cover.pico_relay_02efbe_shutter_1
    type: sections
    sections:
      - type: grid
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Today
            forecast_type: hourly
            forecast_slots: 10
            show_current: false
            show_forecast: true
            grid_options: {columns: 12, rows: 2}
          - type: weather-forecast
            entity: weather.forecast_home
            name: Next days
            forecast_type: daily
            show_current: false
            show_forecast: true
            grid_options: {columns: 12, rows: 3}

          # ── Shutter ───────────────────────────────────────────────
          - type: tile
            entity: cover.pico_relay_02efbe_shutter_1
            name: Shutter
            color: green
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets:
                  - cover.pico_relay_02efbe_shutter_1

          # ── Kodi / Chromecast / socket ──────────────────────────────
          - type: tile
            entity: switch.inside_socket_3
            name: Kodi power
            state_content:
              - state
              - last_changed
            features:
              - type: toggle
            grid_options: {columns: 6, rows: 2}
          - type: tile
            entity: media_player.libreelec_halo
            name: Kodi
            state_content: media_title
            grid_options: {columns: 6, rows: 2}
          - type: tile
            entity: media_player.bedroom_tv
            name: Chromecast
            state_content: media_title
            grid_options: {columns: 12, rows: 2}

          # ── Room sensor ───────────────────────────────────────────
          - type: tile
            entity: sensor.inside_temp_1_temperature
            name: Temperature
            grid_options: {columns: 6, rows: 2}
          - type: tile
            entity: sensor.inside_temp_1_humidity
            name: Humidity
            grid_options: {columns: 6, rows: 2}

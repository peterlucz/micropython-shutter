# 3D printer dashboard — Prusa Core One+ with the Buddy Cam.
#
# Single column: power section first (the only live part while the
# sockets are off), then the live camera in a picture-glance card with
# the print-progress sensors underneath the image, then job details as
# tiles and the job control buttons. The job sensors/buttons are
# unavailable while the printer is idle — they populate as soon as a
# print starts.
#
# Built-in cards only. Pushed to HA at /printer-3d via push_dashboard.py
# (HA requires a hyphen in dashboard url paths).

title: 3D printer
views:
  - title: 3D printer
    path: printer
    icon: mdi:printer-3d
    type: sections
    max_columns: 1
    sections:

      # ── Power ────────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Power
            icon: mdi:power
          # Indicators only — tap opens more-info. Switching goes through
          # the Power button (or the IKEA remote): both run
          # script.printer_power_toggle, which refuses to cut power
          # mid-print (packages/printer_power.yaml).
          - type: tile
            entity: switch.printer_socket_2
            name: Printer
            icon: mdi:printer-3d
            color: blue
            state_content:
              - state
              - last_changed
            grid_options: {columns: 6, rows: 1}
          - type: tile
            entity: switch.printer_socket_1
            name: Light
            icon: mdi:lightbulb
            color: amber
            state_content:
              - state
              - last_changed
            grid_options: {columns: 6, rows: 1}
          - type: button
            name: Power on / off
            icon: mdi:power
            icon_height: 24px
            grid_options: {columns: 12, rows: 1}
            tap_action:
              action: perform-action
              perform_action: script.printer_power_toggle

      # ── Camera ───────────────────────────────────────────────────
      - type: grid
        cards:
          - type: picture-glance
            title: Prusa Core One
            camera_image: camera.prusa_buddy_cam
            camera_view: live
            entities:
              - entity: sensor.prusa_core_one
              - entity: sensor.prusa_core_one_progress
              - entity: sensor.prusa_core_one_print_finish
              - entity: sensor.prusa_core_one_material
            grid_options: {columns: full}

      # ── Print job ────────────────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Print job
            icon: mdi:file-document-outline
          - type: tile
            entity: sensor.prusa_core_one
            name: State
            grid_options: {columns: 6, rows: 1}
          - type: tile
            entity: sensor.prusa_core_one_progress
            grid_options: {columns: 6, rows: 1}
          - type: tile
            entity: sensor.prusa_core_one_filename
            grid_options: {columns: 12, rows: 1}
          - type: tile
            entity: sensor.prusa_core_one_print_start
            grid_options: {columns: 6, rows: 1}
          - type: tile
            entity: sensor.prusa_core_one_print_finish
            grid_options: {columns: 6, rows: 1}
          - type: tile
            entity: sensor.prusa_core_one_material
            grid_options: {columns: 6, rows: 1}
          - type: tile
            entity: sensor.prusa_core_one_print_speed
            grid_options: {columns: 6, rows: 1}
          - type: button
            entity: button.prusa_core_one_pause_job
            name: Pause
            icon: mdi:pause
            grid_options: {columns: 4, rows: 1}
          - type: button
            entity: button.prusa_core_one_resume_job
            name: Resume
            icon: mdi:play
            grid_options: {columns: 4, rows: 1}
          - type: button
            entity: button.prusa_core_one_cancel_job
            name: Cancel
            icon: mdi:stop
            grid_options: {columns: 4, rows: 1}
            tap_action:
              action: perform-action
              perform_action: button.press
              target: {entity_id: button.prusa_core_one_cancel_job}
              confirmation:
                text: Cancel the running print job?

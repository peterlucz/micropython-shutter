# Shutters dashboard — the real covers, grouped by floor and room.
#
# Layout: one section per floor (Upstairs first → left column on desktop,
# top on mobile; Ground floor → right column / below), rooms as subtitle
# headings inside. Each shutter: a tile with a position slider (color:
# green) + a Reset button that calls script.shutter_reset (sets the cover
# to where the group×vent schedule says it should be right now — see
# packages/shutters_controls.yaml). Rooms with two shutters also get a
# room-level Reset; the bottom button resets the whole house (with a
# confirmation prompt).
#
# Built-in cards only. Pushed to HA at /shutters-home via push_dashboard.py
# (HA requires a hyphen in dashboard url paths).

title: Shutters
views:
  - title: Shutters
    path: shutters
    icon: mdi:window-shutter
    type: sections
    max_columns: 2
    sections:

      # ── Upstairs (left / top) ────────────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Upstairs
            heading_style: title
            icon: mdi:home-floor-1

          - type: heading
            heading: Háló
            icon: mdi:bed-king
          - type: tile
            color: green
            entity: cover.pico_relay_02efbe_shutter_1
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efbe_shutter_1]

          - type: heading
            heading: Hanna szoba
            icon: mdi:bed-empty
          - type: tile
            color: green
            entity: cover.pico_relay_02efbe_shutter_2
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efbe_shutter_2]
          - type: tile
            color: green
            entity: cover.pico_relay_02efbc_shutter_1
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efbc_shutter_1]
          - type: button
            name: Reset Hanna szoba
            icon: mdi:restore
            icon_height: 20px
            grid_options: {columns: 12, rows: 1}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets:
                  - cover.pico_relay_02efbc_shutter_1
                  - cover.pico_relay_02efbe_shutter_2

          - type: heading
            heading: Tami szoba
            icon: mdi:bed-empty
          - type: tile
            color: green
            entity: cover.pico_relay_02efbc_shutter_2
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efbc_shutter_2]
          - type: tile
            color: green
            entity: cover.pico_relay_02efbc_shutter_3
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efbc_shutter_3]
          - type: button
            name: Reset Tami szoba
            icon: mdi:restore
            icon_height: 20px
            grid_options: {columns: 12, rows: 1}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets:
                  - cover.pico_relay_02efbc_shutter_2
                  - cover.pico_relay_02efbc_shutter_3

      # ── Ground floor (right / below) ─────────────────────────────
      - type: grid
        cards:
          - type: heading
            heading: Ground floor
            heading_style: title
            icon: mdi:home-floor-0

          - type: heading
            heading: Terasz
            icon: mdi:balcony
          - type: tile
            color: green
            entity: cover.pico_relay_02efc0_shutter_3
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efc0_shutter_3]
          - type: tile
            color: green
            entity: cover.pico_relay_02efc0_shutter_2
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efc0_shutter_2]
          - type: button
            name: Reset Terasz
            icon: mdi:restore
            icon_height: 20px
            grid_options: {columns: 12, rows: 1}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets:
                  - cover.pico_relay_02efc0_shutter_2
                  - cover.pico_relay_02efc0_shutter_3

          - type: heading
            heading: Konyha
            icon: mdi:countertop
          - type: tile
            color: green
            entity: cover.pico_relay_02efc0_shutter_1
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efc0_shutter_1]

          - type: heading
            heading: Dolgozó
            icon: mdi:desk
          - type: tile
            color: green
            entity: cover.pico_relay_02efbe_shutter_0
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            icon_height: 24px
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efbe_shutter_0]

      # ── Whole house ──────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          # Holiday override: >0 = mornings use the holiday program even
          # on workdays; ticks down each midnight (packages/shutters.yaml).
          - type: tile
            entity: input_number.holiday_days_left
            name: Holiday days left
            color: amber
            features:
              - type: numeric-input
                style: buttons
            features_position: inline
            grid_options: {columns: 12, rows: 1}
          - type: button
            name: Reset ALL shutters to schedule
            icon: mdi:restore-alert
            icon_height: 20px
            grid_options: {columns: full, rows: 1}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              confirmation:
                text: Move every shutter in the house to its scheduled position?
              data:
                targets:
                  - cover.pico_relay_02efc0_shutter_2
                  - cover.pico_relay_02efc0_shutter_3
                  - cover.pico_relay_02efc0_shutter_1
                  - cover.pico_relay_02efbe_shutter_0
                  - cover.pico_relay_02efbc_shutter_1
                  - cover.pico_relay_02efbe_shutter_2
                  - cover.pico_relay_02efbc_shutter_2
                  - cover.pico_relay_02efbc_shutter_3
                  - cover.pico_relay_02efbe_shutter_1

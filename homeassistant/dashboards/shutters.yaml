# Shutters dashboard — the real covers, grouped by floor and room.
#
# Each shutter: a tile with a position slider + a Reset button that calls
# script.shutter_reset (sets the cover to where the group×vent schedule says
# it should be right now — see packages/shutters_controls.yaml). Rooms with
# two shutters also get a room-level Reset; the bottom button resets the
# whole house (with a confirmation prompt).
#
# Built-in cards only. Pushed to HA at /shutters-home via push_dashboard.py
# (HA requires a hyphen in dashboard url paths).

title: Shutters
views:
  - title: Shutters
    path: shutters
    icon: mdi:window-shutter
    type: sections
    max_columns: 2
    sections:

      # ── Ground floor ─────────────────────────────────────────────
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Ground floor
            heading_style: title
            icon: mdi:home-floor-0

      - type: grid
        cards:
          - type: heading
            heading: Terasz
            icon: mdi:balcony
          - type: tile
            entity: cover.pico_relay_02efc0_shutter_2
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore
            grid_options: {columns: 4, rows: 2}
            tap_action:
              action: perform-action
              perform_action: script.shutter_reset
              data:
                targets: [cover.pico_relay_02efc0_shutter_2]
          - type: tile
            entity: cover.pico_relay_02efc0_shutter_3
            features:
              - type: cover-position
            grid_options: {columns: 8, rows: 2}
          - type: button
            name: Reset
            icon: mdi:restore

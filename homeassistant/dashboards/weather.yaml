# Weather dashboard — daily + hourly forecast, single column
# Entity: weather.forecast_home (Met.no — the working integration; OWM was abandoned)
#
# The daily card keeps show_current: true, so current conditions sit on top
# of the 5-day forecast. The hourly card uses forecast_slots (undocumented
# but supported by the built-in weather-forecast card, default 5) to show
# 10 hours; on narrow screens the extra slots scroll horizontally inside
# the card.
#
# Built-in cards only. Pushed to HA at /weather-dashboard via push_dashboard.py.

title: Weather
views:
  - title: Weather
    path: weather
    icon: mdi:weather-partly-cloudy
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:

          # ── Current + 5-day forecast ─────────────────────────────
          - type: weather-forecast
            entity: weather.forecast_home
            name: Daily forecast
            forecast_type: daily
            show_current: true
            show_forecast: true
            secondary_info_attribute: humidity

          # ── Hourly forecast (next 10 h) ──────────────────────────
          - type: weather-forecast
            entity: weather.forecast_home
            name: Hourly forecast
            forecast_type: hourly
            forecast_slots: 10
            show_current: false
            show_forecast: true

          # ── Measured vs Met.no vs day-old prediction ─────────────
          # Series plumbing lives in packages/weather_temps.yaml (the
          # "predicted a day ago" SQL sensor only has data from 24 h
          # after first deploy, 2026-07-17 evening onwards).
          - type: heading
            heading: Temperature — measured vs forecast
            icon: mdi:thermometer-lines
          # Statistics graph (hourly means) instead of a history graph:
          # the averaging smooths the sensor jitter, and all three series
          # land on the same hourly grid. Needs long-term statistics, hence
          # the template sensor for Met.no (see packages/weather_temps.yaml).
          - type: statistics-graph
            chart_type: line
            period: hour
            days_to_show: 2
            stat_types:
              - mean
            fit_y_data: true
            entities:
              - entity: sensor.outside_temp_1_temperature
                name: Measured (outside sensor)
              - entity: sensor.outside_temperature_met_no
                name: Met.no current
              - entity: sensor.outside_temperature_predicted_a_day_ago
                name: Predicted a day ago
          - type: gauge
            entity: sensor.outside_temp_1_temperature
            name: Measured
            min: -20
            max: 50
            needle: true
            segments: &temp_segments
              - {from: -20, color: "#3d5afe"}
              - {from: 0, color: "#03a9f4"}
              - {from: 15, color: "#4caf50"}
              - {from: 27, color: "#ff9800"}
              - {from: 35, color: "#f44336"}
            grid_options: {columns: 4, rows: 2}
          - type: gauge
            entity: sensor.outside_temperature_met_no
            name: Met.no
            min: -20
            max: 50
            needle: true
            segments: *temp_segments
            grid_options: {columns: 4, rows: 2}
          - type: gauge
            entity: sensor.outside_temperature_predicted_a_day_ago
            name: Predicted −24h
            min: -20
            max: 50
            needle: true
            segments: *temp_segments
            grid_options: {columns: 4, rows: 2}

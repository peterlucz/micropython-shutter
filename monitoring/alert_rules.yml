groups:
  - name: node-health
    rules:
      - alert: NodeDiskAlmostFull
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100 < 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.alias }} disk usage above 90%"

      - alert: NodeMemoryHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.alias }} memory usage above 90%"

      - alert: NodeDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.alias }} node_exporter target is unreachable"

  - name: pve-health
    rules:
      # The Proxmox host itself isn't scraped by node_exporter (kept off the
      # bare host on purpose -- see monitoring/README.md) so it needs its own
      # rules against pve-exporter's metric names instead of the node-health
      # group above. Without these, removing ops-agent's own host-disk floor
      # (host_metrics.py, 2026-08-26) would leave the host's disk completely
      # unwatched by any threshold anywhere.
      - alert: PveNodeRootDiskAlmostFull
        expr: (pve_disk_usage_bytes{id="node/pve"} / pve_disk_size_bytes{id="node/pve"}) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox host root filesystem usage above 90%"

      - alert: PveStoragePoolAlmostFull
        expr: (pve_disk_usage_bytes{id="storage/pve/local-zfs"} / pve_disk_size_bytes{id="storage/pve/local-zfs"}) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Proxmox local-zfs storage pool usage above 90%"
